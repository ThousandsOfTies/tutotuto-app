<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pages.commerce.documentTitle"></title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
      color: #333;
    }
    .header {
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
      color: white;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.85;
    }
    .header a:hover {
      opacity: 1;
      text-decoration: underline;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }
    .container {
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px 48px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .card-header {
      background: #f8f9fa;
      padding: 16px 24px;
      border-bottom: 1px solid #e9ecef;
      font-size: 13px;
      color: #888;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 14px 24px;
      border-bottom: 1px solid #f0f0f0;
      vertical-align: top;
      line-height: 1.6;
      font-size: 15px;
    }
    tr:last-child th,
    tr:last-child td {
      border-bottom: none;
    }
    th {
      width: 38%;
      text-align: left;
      color: #666;
      font-weight: 500;
      background: #fafafa;
      white-space: nowrap;
    }
    td {
      color: #333;
    }
    small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #999;
    }
    .back-link {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 20px;
      background: #3498db;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
    }
    .back-link:hover {
      background: #2980b9;
    }
    @media (max-width: 540px) {
      th {
        white-space: normal;
        width: 40%;
      }
      th, td {
        padding: 12px 16px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <a href="/TutoTuto/" data-i18n="pages.commerce.back"></a>
    <h1 data-i18n="pages.commerce.title"></h1>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header" data-i18n="pages.commerce.lastUpdated"></div>
      <table>
        <tbody>
          <tr>
            <th data-i18n="pages.commerce.sellerLabel"></th>
            <td data-i18n="pages.commerce.seller"></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.operatorLabel"></th>
            <td><span data-i18n="pages.commerce.operator"></span><small><span data-i18n="pages.commerce.operatorNote"></span><a href="https://forms.gle/8zbWfhw4T6zL9dMq6" target="_blank" rel="noopener" data-i18n="pages.commerce.form"></a><span data-i18n="pages.commerce.closeParenthesis"></span></small></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.addressLabel"></th>
            <td><span data-i18n="pages.commerce.address"></span><small><span data-i18n="pages.commerce.addressNote"></span><a href="https://forms.gle/8zbWfhw4T6zL9dMq6" target="_blank" rel="noopener" data-i18n="pages.commerce.form"></a><span data-i18n="pages.commerce.closeParenthesis"></span></small></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.phoneLabel"></th>
            <td><span data-i18n="pages.commerce.phone"></span><br><a href="https://forms.gle/8zbWfhw4T6zL9dMq6" target="_blank" rel="noopener">https://forms.gle/8zbWfhw4T6zL9dMq6</a><small data-i18n="pages.commerce.phoneNote"></small></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.emailLabel"></th>
            <td>thousands.of.ties@gmail.com</td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.priceLabel"></th>
            <td data-i18n="pages.commerce.price"></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.additionalCostLabel"></th>
            <td data-i18n="pages.commerce.additionalCost"></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.paymentLabel"></th>
            <td data-i18n="pages.commerce.payment"></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.billingLabel"></th>
            <td data-i18n="pages.commerce.billing"></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.availabilityLabel"></th>
            <td data-i18n="pages.commerce.availability"></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.cancellationLabel"></th>
            <td data-i18n="pages.commerce.cancellation"></td>
          </tr>
          <tr>
            <th data-i18n="pages.commerce.refundLabel"></th>
            <td data-i18n="pages.commerce.refund"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <a class="back-link" href="/TutoTuto/" data-i18n="pages.commerce.back"></a>
  </div>
  <script type="module">
    import { loadPageTranslations } from "./page-i18n.js";
    await loadPageTranslations();
  </script>
</body>
</html>
